<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f4e3d">
<title>Panel AxisPOS</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<section id="login" class="pantalla">
  <form id="form-login" class="tarjeta" autocomplete="off">
    <h1>Panel AxisPOS</h1>
    <p class="sub">Inicia sesión con tu usuario de MariaDB</p>
    <label id="fila-servidor" hidden>Servidor (la PC)
      <input id="servidor" inputmode="url" placeholder="http://192.168.1.10:3000">
    </label>
    <label>Usuario <input id="usuario" autocapitalize="none" required></label>
    <label>Contraseña <input id="clave" type="password"></label>
    <details>
      <summary>Opciones de conexión</summary>
      <label>Servidor MariaDB <input id="host" value="127.0.0.1"></label>
      <label>Puerto <input id="puerto" inputmode="numeric" value="3306"></label>
      <label>Base de datos <input id="base" value="axispos_prueba"></label>
    </details>
    <p id="error" class="error" role="alert" hidden></p>
    <button id="entrar" type="submit">Entrar</button>
    <p id="ayuda-ip" class="sub" hidden></p>
  </form>
</section>

<section id="app" class="pantalla" hidden>
  <header>
    <strong id="titulo">Resumen</strong>
    <button id="salir" class="enlace">Salir</button>
  </header>
  <main id="contenido"></main>
  <nav id="tabs">
    <button data-tab="resumen" class="activa">Resumen</button>
    <button data-tab="productos">Productos</button>
    <button data-tab="existencias">Existencias</button>
    <button data-tab="caja">Caja</button>
  </nav>
</section>
<script src="app.js"></script>
</body>
</html>
